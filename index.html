<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>पापा का ज़माना — हर गाने की एक याद होती है</title>
  <meta name="description" content="पापा का ज़माना — पुराने हिंदी गीतों और सुनहरी यादों का सफ़र।">
  <link rel="icon" type="image/png" href="assets/bg.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&family=Mukta:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Hidden HTML5 Audio Players -->
  <audio id="music-audio" style="display: none;"></audio>
  <audio id="ambient-audio" loop style="display: none;"></audio>

  <!-- Background Layer -->
  <div class="bg-container">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="vignette"></div>
    <div class="noise"></div>
  </div>

  <!-- Main Layout -->
  <main class="app-layout">

    <!-- Top Navigation / Status Header -->
    <header class="app-header">
      <div class="header-left">
        <!-- Live Clock -->
        <div id="live-clock" class="hud-pill">00:00:00</div>
      </div>

      <!-- Center spacer -->
      <div class="header-center"></div>

      <!-- External Links -->
      <div class="header-right">
        <a href="https://open.spotify.com/playlist/2AVjI8Z57bqMJVtU3V9X1Q" target="_blank" rel="noopener noreferrer"
          class="social-pill spotify-pill" aria-label="Open Playlist on Spotify">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.559.3z" />
          </svg>
          <span>Spotify</span>
          <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
        <a href="https://music.youtube.com/playlist?list=PLTJ1PnzCWyFw" target="_blank" rel="noopener noreferrer"
          class="social-pill youtube-pill" aria-label="Open Playlist on YT Music">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z" />
          </svg>
          <span>YT Music</span>
          <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
    </header>

    <!-- Center Content: Brand Title & Rotating Vinyl Visualizer -->
    <section class="visualizer-section">
      <div class="brand-container animate-fade-in">
        <h1 class="logo-text">पापा का ज़माना</h1>
        <p class="logo-sub">हर गाने की एक याद होती है</p>
      </div>

      <!-- Vinyl Disk Container -->
      <div class="vinyl-wrapper animate-slide-up">
        <div class="vinyl-arm">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 10 C 60 10, 80 20, 85 45 C 87 55, 80 75, 76 80" stroke="#d1d5db" stroke-width="4"
              stroke-linecap="round" />
            <circle cx="50" cy="10" r="6" fill="#374151" stroke="#9ca3af" stroke-width="2" />
            <rect x="70" y="76" width="12" height="10" rx="2" transform="rotate(-25 76 81)" fill="#4b5563"
              stroke="#e5e7eb" stroke-width="1.5" />
          </svg>
        </div>
        <div class="vinyl-disc-container">
          <div class="vinyl-disc shadow-2xl" id="vinyl-disc">
            <!-- Grooves -->
            <div class="vinyl-groove-1"></div>
            <div class="vinyl-groove-2"></div>
            <!-- Center Label / Album Artwork -->
            <div class="vinyl-label">
              <img id="vinyl-artwork" src="assets/bg.jpg" alt="Album Cover Artwork">
              <div class="vinyl-center-hole"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bottom Section: Music Player Controller Card -->
    <section class="player-section animate-slide-up-delayed">
      <div class="player-card glass">

        <!-- Track Information -->
        <div class="track-info">
          <div class="track-details">
            <h2 id="track-title" class="track-title">Loading first track...</h2>
            <p id="track-artist" class="track-artist">Connecting to radio stream</p>
          </div>

          <!-- Playlist Toggle Button -->
          <button id="playlist-toggle-btn" class="icon-button playlist-btn" aria-label="Toggle Playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span class="badge" id="playlist-count">16</span>
          </button>
        </div>

        <!-- Progress Timeline Slider -->
        <div class="progress-container">
          <div class="time-slider-wrapper">
            <input type="range" id="progress-slider" min="0" max="100" value="0" step="0.1" class="seek-slider"
              aria-label="Seek track position">
            <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%;"></div>
          </div>
          <div class="time-labels">
            <span id="time-current" class="time-lbl">0:00</span>
            <span id="time-total" class="time-lbl">0:00</span>
          </div>
        </div>

        <!-- Core Playback Controls (Prev, Play, Next) -->
        <div class="playback-controls">
          <!-- Barber Vibe (Ambient Mix Control) -->
          <div class="ambient-controls">
            <button id="ambient-toggle-btn" class="ambient-pill" aria-label="Toggle Ambient Radio Static Vibe">
              <span class="ambient-indicator"></span>
              <svg viewBox="0 0 24 24" class="ambient-icon" fill="none" stroke="currentColor" stroke-width="2">
                <!-- Custom Radio Wave SVG -->
                <circle cx="12" cy="12" r="2" />
                <path
                  d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14" />
              </svg>
              <span class="ambient-text">रेडियो वाइब</span>
            </button>
            <div class="ambient-vol-popout glass">
              <span class="vol-label">Vibe Level</span>
              <input type="range" id="ambient-volume" min="0" max="100" value="35" class="vol-slider"
                aria-label="Ambient volume">
            </div>
          </div>

          <div class="middle-buttons">
            <button id="prev-btn" class="control-button media-prev" aria-label="Previous Track">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
              </svg>
            </button>

            <button id="play-btn" class="control-button media-play" aria-label="Play">
              <!-- Play State Icon -->
              <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <!-- Pause State Icon -->
              <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden">
                <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                <rect x="14" y="4" width="4" height="16" rx="1"></rect>
              </svg>
            </button>

            <button id="next-btn" class="control-button media-next" aria-label="Next Track">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                </line>
              </svg>
            </button>
          </div>

          <!-- Volume Controls -->
          <div class="volume-container">
            <button id="volume-mute-btn" class="icon-button vol-btn" aria-label="Mute/Unmute">
              <svg id="vol-icon-high" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              <svg id="vol-icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="hidden">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>
            <input type="range" id="music-volume" min="0" max="100" value="80" class="vol-slider music-vol-slider"
              aria-label="Music volume">
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- Sliding Playlist Drawer -->
  <aside id="playlist-drawer" class="playlist-drawer glass">
    <div class="drawer-header">
      <h3>सदाबहार बॉलीवुड हिट्स</h3>
      <button id="playlist-close-btn" class="icon-button close-btn" aria-label="Close Playlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="drawer-body">
      <ul id="playlist-items" class="playlist-items">
        <!-- List elements will be injected dynamically by app.js -->
      </ul>
    </div>
  </aside>

  <!-- Main Logic -->
  <script src="app.js"></script>
</body>

</html>
